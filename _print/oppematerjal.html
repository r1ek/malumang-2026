<style>
:root{
  --floor:#E7EDF1;      /* saali põrand / jääkate */
  --panel:#FFFFFF;
  --ink:#14213D;        /* tumesinine tint */
  --muted:#5B6B82;
  --teal:#13877B;       /* käsipalli joon — Eesti */
  --blue:#2F55A4;       /* sulgpalli joon — Olümpia */
  --red:#C8233A;        /* korvpalli joon — Välismaa */
  --amber:#E09400;      /* võrkpalli joon — Uudised */
  --led:#FFB21A;        /* tablooleed */
  --board:#101418;
  --ok:#13877B; --bad:#C8233A;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--floor);color:var(--ink);font:17px/1.55 var(--body)}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);line-height:1.02;letter-spacing:.01em;margin:0}
h2{font-size:clamp(34px,5vw,52px);font-weight:900;text-transform:uppercase}
h3{font-size:24px;font-weight:700;text-transform:uppercase}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
nav .wrap{display:flex;gap:4px;align-items:center;overflow-x:auto;height:56px}
nav .brand{font-family:var(--display);font-weight:900;font-size:22px;margin-right:14px;white-space:nowrap;color:var(--led)}
nav a{color:#fff;text-decoration:none;font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;padding:6px 12px;border-radius:6px;white-space:nowrap}
nav a:hover,nav a.on{background:rgba(255,255,255,.12)}

/* ---------- hero: court floor ---------- */
.hero{position:relative;overflow:hidden;padding:56px 0 44px;border-bottom:4px solid var(--ink)}
.hero svg.court{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero .wrap{position:relative;z-index:1}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:18px;color:var(--muted)}
.hero h1{font-size:clamp(54px,11vw,128px);font-weight:900;text-transform:uppercase;margin:6px 0 18px;max-width:9.5em}
.hero h1 span{color:var(--red)}
.hero p.lead{max-width:36em;font-size:19px;margin:0 0 26px}

/* ---------- LED scoreboard (signature) ---------- */
.board{display:inline-grid;grid-auto-flow:column;gap:0;background:var(--board);border-radius:8px;padding:14px 8px;box-shadow:0 0 0 4px #2a3138, 0 14px 30px rgba(20,33,61,.25)}
.board .cell{padding:0 18px;border-right:1px solid #2a3138;text-align:center}
.board .cell:last-child{border-right:0}
.board .lbl{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;color:#8C97A3;text-transform:uppercase}
.board .val{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:var(--led);
  text-shadow:0 0 6px rgba(255,178,26,.55);
  background-image:radial-gradient(rgba(0,0,0,.55) 1px,transparent 1.3px);background-size:4px 4px;-webkit-background-clip:text;background-clip:text}
@media (max-width:560px){.board .cell{padding:0 10px}.board .val{font-size:32px}}

section{padding:56px 0;border-bottom:1px solid #cfd8e0}
.sec-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head p{margin:0;color:var(--muted);max-width:40em}

/* ---------- overview ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.card{background:var(--panel);border-radius:var(--r);padding:20px 22px;border:1px solid #d6dee6}
.card h3{margin-bottom:8px}
.card ul{margin:0;padding-left:20px}
.card li{margin:4px 0}
.bars{display:grid;gap:10px;margin-top:6px}
.bar{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:10px;font-size:15px}
.bar .t{height:14px;background:#e3e9ee;border-radius:7px;overflow:hidden}
.bar .f{height:100%;border-radius:7px}
.prio{counter-reset:p;list-style:none;padding:0;margin:0}
.prio li{counter-increment:p;display:grid;grid-template-columns:40px 1fr;gap:10px;padding:10px 0;border-top:1px solid #e3e9ee}
.prio li:first-child{border-top:0}
.prio li::before{content:counter(p);font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--amber)}
.prio b{display:block}
.tag{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;color:#fff;vertical-align:2px}
.t-Eesti{background:var(--teal)} .t-Olümpia{background:var(--blue)} .t-Välismaa{background:var(--red)}
.t-Uudised,.t-Viimase{background:var(--amber);color:var(--board)} .t-Kiir{background:var(--ink)}
.warn{background:#FFF1D6;color:#7a4f00}

/* ---------- 2023 list + bank ---------- */
.blocktitle{margin:28px 0 10px;display:flex;align-items:center;gap:10px}
.blocktitle .line{flex:1;height:3px;border-radius:2px}
.qlist{display:grid;gap:8px}
.qi{background:var(--panel);border:1px solid #d6dee6;border-left:6px solid var(--c,var(--ink));border-radius:8px;padding:12px 16px}
.qi .qn{font-family:var(--display);font-weight:900;font-size:20px;color:var(--c,var(--ink));margin-right:8px}
.qi button.reveal{margin-top:8px}
.ans{margin-top:8px;padding:8px 12px;background:#EEF6F4;border-radius:6px;font-weight:700}
.ans[hidden]{display:none}
.note{margin-top:6px;font-size:15px;color:#7a4f00;background:#FFF1D6;border-radius:6px;padding:6px 10px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input[type=search],input.answer{font:inherit;border:2px solid #b9c6d2;border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
input[type=search]{max-width:420px}
input:focus{border-color:var(--blue);outline:none}
.chip{font:700 14px var(--body);border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:8px 14px;font-size:16px}
.btn.small{font-size:15px;padding:5px 10px}
.btn.led{background:var(--led);color:var(--board)}
.count{color:var(--muted);font-size:15px}
.flag{font-size:12px}
details.tbl{background:var(--panel);border:1px solid #d6dee6;border-radius:8px;margin:10px 0}
details.tbl summary{cursor:pointer;padding:12px 16px;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase}
details.tbl .inner{overflow-x:auto;padding:0 16px 16px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #e3e9ee;vertical-align:top}
th{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* ---------- test ---------- */
.tq{background:var(--panel);border:1px solid #d6dee6;border-left:6px solid var(--c);border-radius:8px;padding:14px 16px;display:grid;gap:8px}
.tq label{display:block}
.tq .qn{font-family:var(--display);font-weight:900;font-size:22px;color:var(--c);margin-right:6px}
.tq .res{display:none;gap:10px;align-items:center;flex-wrap:wrap}
.checked .tq .res{display:flex}
.verdict{font-family:var(--display);font-weight:900;font-size:18px;text-transform:uppercase;padding:2px 10px;border-radius:4px;color:#fff}
.verdict.ok{background:#0E6B61} .verdict.bad{background:var(--bad)}
.tq .key{font-weight:700}
.tq .ovr{margin-left:auto;display:flex;gap:6px}
.dock{position:sticky;bottom:0;z-index:15;background:var(--ink);color:#fff;margin-top:24px}
.dock .wrap{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 20px;flex-wrap:wrap}
#scorebox{margin-top:28px;display:none}
.checked #scorebox{display:block}
.breakdown{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.breakdown span{background:var(--panel);border-radius:6px;padding:6px 10px;border-left:5px solid var(--c);font-weight:700}
footer{padding:30px 0 60px;color:var(--muted);font-size:14px}
.qi .ans{margin-top:6px}
@media (max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 14px}
  section{padding:40px 0}
  .qi,.tq{padding:10px 12px}
  .bar{grid-template-columns:120px 1fr 44px;font-size:14px}
  .tq .ovr{margin-left:0}
  .btn.small{min-height:44px;padding:8px 16px}
  .dock .wrap{padding:8px 14px}
  .dock .btn{font-size:15px;padding:8px 12px}
  nav .brand{display:none}
  nav .wrap{gap:0;justify-content:space-between;padding:0 6px}
  nav a{font-size:16px;padding:6px 7px}
}
</style>
