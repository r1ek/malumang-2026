ulaskjad-purgivad-olumpiale-peame-kaima-koikidel-voistlustel"}, {"r": "L1", "q": "Tokyo 2020: milline Jaapanist pärit võitluskunst oli Tokyos ühekordselt kavas, kuid Pariisi 2024 ja Los Angeles 2028 kavas seda pole?", "a": "karate", "x": "Lisaküsimus: millises kuulsas Tokyo hallis võisteldi? Nippon Budokan Kavas oli 8 ala: kata ja kumite (kumbki sugu 3 kaalukategooriat). Kata võitjad olid Ryo Kiyuna (Jaapan) ja Sandra Sánchez (Hispaania). 2022. aastal oli karate LA28 lühinimekirjas, kuid valituks ei osutunud.", "u": "https://en.wikipedia.org/wiki/Karate_at_the_Summer_Olympics"}, {"r": "L1", "q": "Tokyo 2020: kes võitis spordironimise esimese naiste olümpiakulla (kombineeritud ala)?", "a": "Janja Garnbret (Sloveenia)", "x": "Lisaküsimus: kes võitis meestest? Alberto Ginés López (Hispaania), 18-aastane Tokyos olid kiirus-, boulder- ja raskusronimine üheks kombineeritud alaks liidetud. Garnbret võitis kulla ka Pariisis 2024. Los Angeleses on boulder ja raskusronimine eraldi alad, kokku 6 medaliala.", "u": "https://gearjunkie.com/olympics/olympic-games-climbing-tokyo"}, {"r": "L1", "q": "Los Angeles 2028, sõudmine: milline uus ala tuli meeste ja naiste kergekaalu paarisaerulise kahepaadi võistluste asemel?", "a": "meresõudmise rannasprint (coastal rowing beach sprint)", "x": "Lisaküsimus: millises kolmes ujumisviisis lisandus LA28 kavva 50 m distants? selili, rinnuli, liblikas (meestele ja naistele, kokku 6 medaliala) Meresõudmises on kolm medaliala: meeste ja naiste üksik ning segapaar paarisaerulisel paadil. Kergejõustikus tuleb kavva 4 × 100 m segateade ja käimise segateade jääb ära. Golfis, sportvõimlemises ja lauatennises lisanduvad segavõistkonnad. Eesti meeste neljapaat võitis 2021. aastal ühe meresõudmise European Rowing Coastal Challenge'i võistluse.", "u": "https://en.wikipedia.org/wiki/2028_Summer_Olympics"}, {"r": "L1", "q": "Milano-Cortina 2026, mäesuusatamine: mitu sportlast oli võistkonnas uues võistkondlikus kombinatsioonis?", "a": "2", "x": "Üks sõitis
