const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const m=document.getElementById("m");
let n=0;
const card=q=>`<div class="card"><div class="top"><span class="id">${++n}.</span><p class="q">${esc(q.q)}</p></div>
 <div class="ans"><div class="a">${esc(q.a)}</div>${q.x?`<p class="x">${esc(q.x)}</p>`:""}</div></div>`;
D.q.forEach(q=>q.t=norm([q.q,q.a,q.x].join(" ")));
